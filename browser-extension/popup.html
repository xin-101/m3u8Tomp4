<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font-family: "Microsoft YaHei", sans-serif; background: #1e1f22; color: #d7d8db; margin: 0; padding: 12px; }
    h3 { margin: 0 0 10px; color: #ffffff; font-size: 14px; }
    button { width: 100%; background: #3b82f6; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; margin-top: 8px; cursor: pointer; }
    button:hover { background: #2f6fe0; }
    input { width: 100%; background: #2b2d31; color: #d7d8db; border: 1px solid #44474e; border-radius: 5px; padding: 6px 8px; box-sizing: border-box; }
    .item { font-size: 12px; padding: 4px 0; word-break: break-all; border-bottom: 1px solid #33353a; }
    .status { font-size: 12px; color: #8a8f98; margin: 6px 0; }
    a { color: #3b82f6; text-decoration: none; }
  </style>
</head>
<body>
  <h3>m3u8ToMp4 助手</h3>
  <div class="status" id="status">检测到 m3u8 地址会自动高亮…</div>
  <div id="recent"></div>
  <button id="btnSendCurrent">提取当前页视频并发送</button>
  <button id="btnSendUrl">发送手动输入的地址</button>
  <input id="manualUrl" placeholder="粘贴 m3u8 地址..." style="margin-top:8px;">
  <div class="status">客户端需运行中(API: 127.0.0.1:18888)</div>
  <script src="popup.js"></script>
</body>
</html>
